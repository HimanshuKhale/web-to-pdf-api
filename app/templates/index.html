<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webpage to PDF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 640px;
            background: #ffffff;
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            padding: 28px;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
            line-height: 1.2;
            letter-spacing: -0.04em;
        }

        .subtitle {
            margin: 0 0 24px;
            color: #64748b;
            font-size: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            height: 42px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 0 12px;
            font-size: 15px;
            font-weight: 600;
            color: #020617;
            background: #ffffff;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .field {
            margin-bottom: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 16px;
        }

        .checks {
            display: flex;
            gap: 28px;
            align-items: center;
            margin: 12px 0 22px;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        .check-item input {
            width: 16px;
            height: 16px;
            padding: 0;
        }

        button {
            width: 100%;
            height: 44px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .hint {
            margin-top: 18px;
            color: #64748b;
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 640px) {
            body {
                align-items: flex-start;
            }

            .card {
                padding: 22px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .checks {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Webpage to PDF</h1>
        <p class="subtitle">Paste a webpage URL and download a clean PDF copy.</p>

        <form action="/convert" method="post">
            <div class="field">
                <label for="url">Webpage URL</label>
                <input
                    id="url"
                    name="url"
                    type="text"
                    placeholder="https://example.com"
                    required
                >
            </div>

            <div class="field">
                <label for="custom_name">Custom PDF name</label>
                <input
                    id="custom_name"
                    name="custom_name"
                    type="text"
                    placeholder="Optional filename"
                >
            </div>

            <div class="grid">
                <div>
                    <label for="page_format">Page format</label>
                    <select id="page_format" name="page_format">
                        <option value="A4" selected>A4</option>
                        <option value="Letter">Letter</option>
                        <option value="Legal">Legal</option>
                    </select>
                </div>

                <div>
                    <label for="margin">Margin</label>
                    <select id="margin" name="margin">
                        <option value="0mm">0mm</option>
                        <option value="5mm">5mm</option>
                        <option value="10mm">10mm</option>
                        <option value="12mm" selected>12mm</option>
                        <option value="20mm">20mm</option>
                    </select>
                </div>
            </div>

            <div class="checks">
                <label class="check-item" for="clean">
                    <input
                        id="clean"
                        name="clean"
                        type="checkbox"
                        value="true"
                        checked
                    >
                    Clean mode
                </label>

                <label class="check-item" for="landscape">
                    <input
                        id="landscape"
                        name="landscape"
                        type="checkbox"
                        value="true"
                    >
                    Landscape
                </label>
            </div>

            <button type="submit">Convert and Download PDF</button>
        </form>

        <p class="hint">
            Generated PDFs are saved in the <strong>Session_4_pdf</strong> folder.
            Some sites may block browser automation or load slowly because of ads/scripts.
        </p>
    </main>
</body>
</html>
